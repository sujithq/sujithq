name: Feature request
description: Suggest an improvement to the profile or its supporting automation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to change?
      description: Explain the proposed profile content, asset, or automation update.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this useful?
    validations:
      required: true
